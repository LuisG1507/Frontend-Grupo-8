<section class="menu-home">
  <div class="home-hero">
    <div>
      <p class="eyebrow">Panel principal</p>
      <h1>SmartRent</h1>
      <p class="hero-copy">Gestion centralizada de inmuebles, usuarios, contratos y actividad del sistema.</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button color="primary" routerLink="/estates/list">
        <mat-icon>apartment</mat-icon>
        Inmuebles
      </button>
      @if (isAdmin()) {
        <button mat-stroked-button routerLink="/users/list">
          <mat-icon>group</mat-icon>
          Usuarios
        </button>
      }
    </div>
  </div>

  <div class="summary-grid">
    @if (isAdmin()) {
      <mat-card class="summary-card" routerLink="/favorites/list">
        <mat-card-header>
          <mat-icon mat-card-avatar>favorite</mat-icon>
          <mat-card-title>Favoritos</mat-card-title>
          <mat-card-subtitle>Inmuebles guardados</mat-card-subtitle>
        </mat-card-header>
      </mat-card>

      <mat-card class="summary-card" routerLink="/contracts/list">
        <mat-card-header>
          <mat-icon mat-card-avatar>description</mat-icon>
          <mat-card-title>Contratos</mat-card-title>
          <mat-card-subtitle>Fechas y estados</mat-card-subtitle>
        </mat-card-header>
      </mat-card>
    }

    <mat-card class="summary-card" routerLink="/risk-reports/list">
      <mat-card-header>
        <mat-icon mat-card-avatar>report</mat-icon>
        <mat-card-title>Riesgos</mat-card-title>
        <mat-card-subtitle>Reportes registrados</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
  </div>

</section>
