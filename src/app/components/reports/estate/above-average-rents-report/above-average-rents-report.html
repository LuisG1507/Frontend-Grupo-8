<section class="chart-report">
  <h2>Alquileres sobre el promedio</h2>
  <p>Inmuebles cuyo precio mensual supera el promedio de la plataforma.</p>

  @if (hasData) {
    <div class="chart-wrapper">
      <canvas
        baseChart
        [datasets]="barChartData"
        [labels]="barChartLabels"
        [options]="barChartOptions"
        [legend]="barChartLegend"
        [type]="barChartType">
      </canvas>
    </div>
  } @else {
    <div class="no-data">
      <mat-icon>info_outline</mat-icon>
      <span>No hay alquileres sobre el promedio.</span>
    </div>
  }
</section>
