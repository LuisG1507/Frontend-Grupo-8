<section class="card-list-page">
  <header class="list-header">
    <div>
      <p>Contratos</p>
      <h1>Ingresos por distrito</h1>
    </div>
  </header>

  @if (distritos.length > 0) {
    <div class="charts-row">
      <mat-card class="chart-card">
        <mat-card-header>
          <mat-icon mat-card-avatar>bar_chart</mat-icon>
          <mat-card-title>Ingreso total por distrito</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="chart-container">
            <canvas baseChart [data]="barChartData" [options]="barChartOptions" type="bar"></canvas>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="chart-card">
        <mat-card-header>
          <mat-icon mat-card-avatar>pie_chart</mat-icon>
          <mat-card-title>Participacion sobre el total</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="chart-container">
            <canvas baseChart [data]="doughnutChartData" [options]="doughnutChartOptions" type="doughnut"></canvas>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  }

  
</section>
