<section class="card-list-page">
  <header class="list-header">
    <div>
      <p>Resenas</p>
      <h1>Mejores arrendadores</h1>
    </div>
  </header>

  @if (arrendadores.length > 0) {
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>bar_chart</mat-icon>
        <mat-card-title>Comparativa de calificaciones</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="chart-container">
          <canvas baseChart [data]="chartData" [options]="chartOptions" type="bar"></canvas>
        </div>
      </mat-card-content>
    </mat-card>
  }

  
</section>
